<body>
<title>Cherry Agendamento</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap">
<style>
/* Layout: uma coluna estreita para celular; faixa da marca no topo, 3 passos em sequência, barra fixa com total e botão. */
:root {
  --bg: #fdf6f8;
  --surface: #ffffff;
  --ink: #3b1e1a;
  --muted: #6b5450;
  --line: #f1dde3;
  --berry: #c2185b;
  --berry-deep: #8e1043;
  --berry-tint: #fce4ec;
  --on-berry: #ffffff;
  --ok: #1e7a4f;
  --warn-bg: #fcebdd;
  --warn-ink: #8a420c;
  --font-display: "Baloo 2", "Nunito Sans", system-ui, sans-serif;
  --font-body: "Nunito Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --radius: 16px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1a1316; --surface: #251b1f; --ink: #f6eaee; --muted: #c4aab3; --line: #3a2a30;
    --berry: #f0628f; --berry-deep: #ffb3c8; --berry-tint: #3c2230; --on-berry: #1a1316;
    --ok: #57d39a; --warn-bg: #3a2a1c; --warn-ink: #f2bf8f; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1a1316; --surface: #251b1f; --ink: #f6eaee; --muted: #c4aab3; --line: #3a2a30;
  --berry: #f0628f; --berry-deep: #ffb3c8; --berry-tint: #3c2230; --on-berry: #1a1316;
  --ok: #57d39a; --warn-bg: #3a2a1c; --warn-ink: #f2bf8f; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
.wrap {
  max-width: 560px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--berry); outline-offset: 2px; border-radius: 8px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ---------- Topo ---------- */
.brand { background: var(--berry); color: var(--on-berry); }
.brand .wrap { padding-block: 18px 22px; display: grid; gap: 14px; }
.brand-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.made { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 13px; letter-spacing: .04em; text-transform: uppercase; opacity: .92; }
.made img { width: 28px; height: 28px; border-radius: 8px; }
.langs { display: flex; gap: 6px; }
.lang {
  display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 10px;
  border-radius: 999px; border: 1.5px solid color-mix(in srgb, var(--on-berry) 45%, transparent);
  background: transparent; color: var(--on-berry); font-weight: 800; font-size: 12px; cursor: pointer;
}
.lang[aria-pressed="true"] { background: var(--on-berry); color: var(--berry); border-color: var(--on-berry); }
.flag { width: 20px; height: 14px; border-radius: 2px; display: block; }
.salon h1 {
  font-family: var(--font-display); font-weight: 800; font-size: clamp(28px, 7vw, 36px);
  line-height: 1.05; margin: 0; text-wrap: balance;
}
.salon p { margin: 6px 0 0; font-weight: 600; opacity: .92; }
.demo-pill {
  justify-self: start; font-size: 12px; font-weight: 800; padding: 4px 10px; border-radius: 999px;
  background: color-mix(in srgb, var(--on-berry) 22%, transparent);
}

/* ---------- Passos ---------- */
main .wrap { padding-block: 8px 140px; display: grid; gap: 8px; }
.step { padding-top: 18px; display: grid; gap: 12px; }
.step-head { display: flex; align-items: baseline; gap: 10px; }
.step-num {
  flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center;
  background: var(--berry-tint); color: var(--berry-deep); font-weight: 800; font-size: 14px;
}
.step-num.done { background: var(--berry); color: var(--on-berry); }
.step h2 { font-family: var(--font-display); font-size: 22px; font-weight: 700; margin: 0; line-height: 1.2; }
.hint { color: var(--muted); font-size: 14px; margin: 0; }

/* Serviços */
.services { display: grid; gap: 8px; }
.svc {
  display: flex; align-items: center; gap: 12px; padding: 14px; min-height: 60px;
  background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--radius);
  cursor: pointer; text-align: left; width: 100%;
}
.svc[aria-pressed="true"] { border-color: var(--berry); background: var(--berry-tint); }
.check {
  flex: none; width: 24px; height: 24px; border-radius: 8px; border: 2px solid var(--line);
  display: grid; place-items: center; background: var(--surface);
}
.svc[aria-pressed="true"] .check { background: var(--berry); border-color: var(--berry); }
.check svg { width: 14px; height: 14px; opacity: 0; }
.svc[aria-pressed="true"] .check svg { opacity: 1; }
.svc-name { flex: 1; min-width: 0; font-weight: 800; }
.svc-meta { display: block; color: var(--muted); font-weight: 600; font-size: 13px; }
.svc-price { font-weight: 800; font-variant-numeric: tabular-nums; }

/* Datas */
.days {
  display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; scroll-snap-type: x mandatory;
  margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
  padding-inline: max(16px, env(safe-area-inset-left, 0px));
}
.day {
  flex: none; width: 64px; padding: 10px 0; border-radius: 14px; border: 1.5px solid var(--line);
  background: var(--surface); display: grid; justify-items: center; gap: 2px; cursor: pointer;
  scroll-snap-align: start;
}
.day small { font-size: 11px; font-weight: 800; letter-spacing: .05em; color: var(--muted); text-transform: uppercase; }
.day b { font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; }
.day[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.day[aria-pressed="true"] small { color: var(--bg); opacity: .8; }

/* Horários */
.slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 8px; }
.slot {
  min-height: 44px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface);
  font-weight: 800; font-variant-numeric: tabular-nums; cursor: pointer;
}
.slot[aria-pressed="true"] { background: var(--berry); border-color: var(--berry); color: var(--on-berry); }
.slot:disabled { background: transparent; color: var(--muted); text-decoration: line-through; cursor: not-allowed; opacity: .6; }
.empty { padding: 14px; border-radius: var(--radius); background: var(--surface); border: 1.5px dashed var(--line); color: var(--muted); font-weight: 600; }

/* Formulário */
.form { display: grid; gap: 12px; }
.field { display: grid; gap: 6px; }
.field label { font-size: 13px; font-weight: 800; color: var(--muted); }
.field input, .field textarea {
  width: 100%; min-height: 48px; padding: 12px 14px; border-radius: 14px;
  border: 1.5px solid var(--line); background: var(--surface);
}
.field textarea { min-height: 76px; resize: vertical; }
.field input:focus, .field textarea:focus { outline: none; border-color: var(--berry); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 380px) { .row2 { grid-template-columns: 1fr; } }
.error { color: var(--warn-ink); background: var(--warn-bg); padding: 12px 14px; border-radius: 12px; font-weight: 700; }

/* Barra fixa */
.bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
}
.bar .wrap { padding-block: 12px 0; display: flex; align-items: center; gap: 14px; }
.total { display: grid; min-width: 0; }
.total small { font-size: 12px; font-weight: 700; color: var(--muted); }
.total b { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }
.cta {
  flex: 1; min-height: 52px; border: none; border-radius: 14px; background: var(--berry); color: var(--on-berry);
  font-weight: 800; font-size: 16px; cursor: pointer; padding: 0 14px;
}
.cta:disabled { background: var(--line); color: var(--muted); cursor: not-allowed; }

/* Confirmação */
.done { padding-block: 28px 40px; display: grid; gap: 16px; justify-items: start; }
.done-badge { width: 64px; height: 64px; border-radius: 50%; background: var(--berry-tint); display: grid; place-items: center; }
.done h2 { font-family: var(--font-display); font-size: 30px; line-height: 1.1; margin: 0; text-wrap: balance; }
.summary { width: 100%; background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--radius); padding: 16px; display: grid; gap: 8px; }
.summary div { display: flex; justify-content: space-between; gap: 12px; }
.summary span { color: var(--muted); font-weight: 600; }
.summary strong { text-align: right; }
.btn-line {
  min-height: 48px; padding: 0 18px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--surface);
  font-weight: 800; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; color: var(--ink);
}
.phone { font-weight: 800; user-select: all; }
.loading { padding: 40px 0; color: var(--muted); font-weight: 700; }
footer { text-align: center; color: var(--muted); font-size: 13px; padding-block: 8px 24px; }
footer b { color: var(--ink); }

    method: 'POST',
    headers: { apikey: CHERRY_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  if (!res.ok) throw new Error(await res.text());
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}

function demoSalon() {
  const busy = [];
  const tomorrow = new Date(); tomorrow.setDate(tomorrow.getDate() + 1);
  [[9, 0, 90], [13, 30, 60]].forEach(([h, m, d]) => {
    const x = new Date(tomorrow); x.setHours(h, m, 0, 0); busy.push({ starts_at: x.toISOString(), duration_min: d });
  });
  return {
    name: 'Pet Spa Spartanburg', phone: '8645550123', address: '[Endereço do salão] · Spartanburg, SC',
    open_hour: 8, close_hour: 18, slot_minutes: 30, busy,
    services: [
      { id: 'a', name: 'Banho', price: 35, duration_min: 60 },
      { id: 'b', name: 'Corte de unhas', price: 10, duration_min: 10 },
      { id: 'c', name: 'Hidratação', price: 20, duration_min: 15 },
      { id: 'd', name: 'Leva e traz', price: 15, duration_min: 0 },
      { id: 'e', name: 'Tosa higiênica', price: 15, duration_min: 20 },
      { id: 'f', name: 'Tosa na tesoura', price: 65, duration_min: 90 },
    ],
  };
}

// ---------------- Render ----------------
function renderLangs() {
  $('langs').innerHTML = ['en', 'pt', 'es'].map((l) =>
    `<button type="button" class="lang" data-lang="${l}" aria-pressed="${l === lang}">${FLAGS[l]}${l.toUpperCase()}</button>`).join('');
}

function renderStatic() {
  document.documentElement.lang = LOCALES[lang];
  $('loading').textContent = t('loading');
  $('h1').textContent = t('s1'); $('h2').textContent = t('s2'); $('h3').textContent = t('s3');
  $('lClient').textContent = t('client'); $('lPhone').textContent = t('phone');
  $('lPet').textContent = t('pet'); $('lBreed').textContent = t('breed');
  $('lNotes').textContent = t('notes'); $('notes').placeholder = t('notesPh');
  $('totalLabel').textContent = t('total');
  $('again').textContent = t('again');
  $('demoPill').textContent = t('demo');
  $('footer').innerHTML = `${t('madeBy')} <b>Cherry</b> · <b>ReluhSC</b>`;
  renderLangs();
}

function renderSalon() {
  const s = state.salon;
  $('salonName').textContent = s.name;
  $('salonInfo').textContent = s.address || '';
}

function selectedServices() {
  return state.salon.services.filter((x) => state.selected.has(x.id));
}
function totalMinutes() {
  const m = selectedServices().reduce((a, x) => a + (x.duration_min || 0), 0);
  return m > 0 ? m : state.salon.slot_minutes || 30;
}

function renderServices() {
  $('services').innerHTML = state.salon.services.map((x) => `
    <button type="button" class="svc" data-svc="${x.id}" aria-pressed="${state.selected.has(x.id)}">
      <span class="check">${CHECK}</span>
      <span class="svc-name">${escapeHtml(x.name)}${x.duration_min > 0 ? `<span class="svc-meta">${dur(x.duration_min)}</span>` : ''}</span>
      <span class="svc-price">${money(Number(x.price))}</span>
    </button>`).join('');
  $('n1').classList.toggle('done', state.selected.size > 0);
}

function renderDays() {
  const days = [];
  const start = new Date(); start.setHours(0, 0, 0, 0);
  for (let i = 0; i < 21; i++) { const d = new Date(start); d.setDate(start.getDate() + i); days.push(d); }
  if (!state.day) state.day = days[0];
  $('days').innerHTML = days.map((d) => `
    <button type="button" class="day" data-day="${d.toISOString()}" aria-pressed="${dayKey(d) === dayKey(state.day)}">
      <small>${d.toLocaleDateString(LOCALES[lang], { weekday: 'short' }).replace('.', '')}</small>
      <b>${d.getDate()}</b>
      <small>${d.toLocaleDateString(LOCALES[lang], { month: 'short' }).replace('.', '')}</small>
    </button>`).join('');
}

function freeSlots() {
  const s = state.salon, out = [], step = s.slot_minutes || 30, need = totalMinutes();
  const now = new Date();
  const busy = (s.busy || []).map((b) => { const a = new Date(b.starts_at); return [a.getTime(), a.getTime() + (b.duration_min || 60) * 60000]; });
  for (let m = s.open_hour * 60; m + Math.min(need, step) <= s.close_hour * 60; m += step) {
    const st = new Date(state.day); st.setHours(Math.floor(m / 60), m % 60, 0, 0);
    const en = st.getTime() + need * 60000;
    const past = st.getTime() < now.getTime() + 30 * 60000;
    const clash = busy.some(([a, b]) => st.getTime() < b && a < en);
    out.push({ date: st, free: !past && !clash && en <= new Date(state.day).setHours(s.close_hour, 0, 0, 0) });
  }
  return out;
}

function renderSlots() {
  const has = state.selected.size > 0;
  const list = has ? freeSlots() : [];
  if (state.slot && !list.some((x) => x.free && x.date.getTime() === state.slot.getTime())) state.slot = null;
  const anyFree = list.some((x) => x.free);
  $('slots').innerHTML = list.map((x) => `
    <button type="button" class="slot" data-slot="${x.date.toISOString()}" ${x.free ? '' : 'disabled'}
      aria-pressed="${!!state.slot && state.slot.getTime() === x.date.getTime()}">${timeLabel(x.date)}</button>`).join('');
  $('noSlots').hidden = has && anyFree;
  $('noSlots').textContent = has ? t('noSlots') : t('pickService');
  $('n2').classList.toggle('done', !!state.slot);
}

function renderBar() {
  const total = selectedServices().reduce((a, x) => a + Number(x.price), 0);
  $('total').textContent = money(total);
  $('submit').disabled = !(state.selected.size && state.slot);
  $('submit').textContent = state.sending ? t('sending') : t('send');
}

function renderAll() {
  renderStatic();
  if (!state.salon) return;
  renderSalon(); renderServices(); renderDays(); renderSlots(); renderBar();
  if (state.sent) renderDone();
}

function renderDone() {
  const d = state.sent;
  $('doneTitle').textContent = t('doneTitle');
  $('doneText').textContent = t('doneText');
  $('summary').innerHTML = `
    <div><span>${t('when')}</span><strong>${d.when.toLocaleDateString(LOCALES[lang], { weekday: 'long', day: 'numeric', month: 'long' })} · ${timeLabel(d.when)}</strong></div>
    <div><span>${t('pet2')}</span><strong>${escapeHtml(d.pet)}</strong></div>
    <div><span>${t('services')}</span><strong>${escapeHtml(d.services)}</strong></div>
    <div><span>${t('estimate')}</span><strong>${money(d.total)}</strong></div>`;
  const phone = (state.salon.phone || '').replace(/\D/g, '');
  if (phone.length >= 8) {
    const intl = phone.length === 10 ? '1' + phone : phone;
    $('contactLine').hidden = false;
    $('contactLine').innerHTML = `${t('contact')} <span class="phone">${escapeHtml(state.salon.phone)}</span>`;
    $('waLink').hidden = false;
    $('waLink').href = 'https://wa.me/' + intl;
    $('waLink').textContent = t('wa');
  }
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// ---------------- Eventos ----------------
document.addEventListener('click', (e) => {
  const l = e.target.closest('[data-lang]');
  if (l) { lang = l.dataset.lang; try { localStorage.setItem('cherry-lang', lang); } catch (err) {} renderAll(); return; }
  const svc = e.target.closest('[data-svc]');
  if (svc) { const id = svc.dataset.svc; state.selected.has(id) ? state.selected.delete(id) : state.selected.add(id); renderServices(); renderSlots(); renderBar(); return; }
  const day = e.target.closest('[data-day]');
  if (day) { state.day = new Date(day.dataset.day); state.slot = null; renderDays(); renderSlots(); renderBar(); return; }
  const slot = e.target.closest('[data-slot]');
  if (slot && !slot.disabled) { state.slot = new Date(slot.dataset.slot); renderSlots(); renderBar(); }
});

$('booking').addEventListener('submit', async (e) => {
  e.preventDefault();
  const name = $('clientName').value.trim(), phone = $('phone').value.trim(), pet = $('petName').value.trim();
  const err = $('formError');
  err.hidden = true;
  if (!name || !phone || !pet) { err.textContent = t('missing'); err.hidden = false; err.scrollIntoView({ block: 'center' }); return; }
  if (phone.replace(/\D/g, '').length < 7) { err.textContent = t('badPhone'); err.hidden = false; err.scrollIntoView({ block: 'center' }); return; }
  if (!state.selected.size || !state.slot) return;

  state.sending = true; renderBar(); $('submit').disabled = true;
  const services = selectedServices();
  try {
    if (!isDemo) {
      await rpc('request_booking', {
        p_slug: slug, p_client_name: name, p_phone: phone, p_pet_name: pet,
        p_breed: $('breed').value.trim() || null, p_service_ids: services.map((x) => x.id),
        p_starts_at: state.slot.toISOString(), p_notes: $('notes').value.trim() || null,
      });
    } else {
      await new Promise((r) => setTimeout(r, 500));
    }
    state.sent = { when: state.slot, pet, services: services.map((x) => x.name).join(' + '), total: services.reduce((a, x) => a + Number(x.price), 0) };
    $('booking').hidden = true; $('bar').hidden = true; $('done').hidden = false;
    renderDone();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  } catch (ex) {
    err.textContent = t('sendError'); err.hidden = false;
  } finally {
    state.sending = false; renderBar();
  }
});

$('again').addEventListener('click', () => {
  state.sent = null; state.slot = null; state.selected.clear();
  $('petName').value = ''; $('breed').value = ''; $('notes').value = '';
  $('done').hidden = true; $('booking').hidden = false; $('bar').hidden = false;
  if (!isDemo) load(); else renderAll();
});

// ---------------- Início ----------------
async function load() {
  renderStatic();
  try {
    const salon = isDemo ? demoSalon() : (slug ? await rpc('public_salon', { p_slug: slug }) : null);
    if (!salon) { $('loading').hidden = true; $('fatal').textContent = t('notFound'); $('fatal').hidden = false; $('salonName').textContent = 'Cherry'; return; }
    salon.services = (salon.services || []).map((x) => ({ ...x, price: Number(x.price) }));
    state.salon = salon;
    $('loading').hidden = true; $('booking').hidden = false; $('bar').hidden = false;
    $('demoPill').hidden = !isDemo;
    renderAll();
  } catch (ex) {
    $('loading').hidden = true; $('fatal').textContent = t('loadError'); $('fatal').hidden = false;
  }
}
load();
</script>

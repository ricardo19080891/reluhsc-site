<style>
:root {
  --bg: #f6f4ef; --surface: #ffffff; --ink: #1f2a2a; --muted: #5b6766; --line: #e3e0d8;
  --brand: #0e6b66; --brand-deep: #08504c; --brand-tint: #dff2ef; --on-brand: #ffffff;
  --accent: #e4407a; --ok: #1e7a4f; --err: #b3261e; --err-bg: #fbe9e7;
  --font-display: "Fraunces", Georgia, serif;
  --font-body: "Nunito Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --radius: 16px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111716; --surface: #1a2221; --ink: #e9f1ef; --muted: #a9b7b5; --line: #2b3534;
    --brand: #5cc8bd; --brand-deep: #9fe3da; --brand-tint: #1d3532; --on-brand: #0b1514;
    --accent: #ff7aa5; --ok: #57d39a; --err: #ffb4ab; --err-bg: #3b1d1a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111716; --surface: #1a2221; --ink: #e9f1ef; --muted: #a9b7b5; --line: #2b3534;
  --brand: #5cc8bd; --brand-deep: #9fe3da; --brand-tint: #1d3532; --on-brand: #0b1514;
  --accent: #ff7aa5; --ok: #57d39a; --err: #ffb4ab; --err-bg: #3b1d1a; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body);
  font-size: 16px; line-height: 1.45; -webkit-font-smoothing: antialiased; padding-bottom: 120px; }
.wrap { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px)); }
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; border-radius: 8px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* Topo com faixa de retalhos */
.brand { background: var(--brand); color: var(--on-brand); position: relative; }
.patch { height: 10px; display: grid; grid-template-columns: repeat(8, 1fr); }
.patch i:nth-child(8n+1){background:#1A9AA8}.patch i:nth-child(8n+2){background:#F28C28}
.patch i:nth-child(8n+3){background:#E4407A}.patch i:nth-child(8n+4){background:#6DAA3C}
.patch i:nth-child(8n+5){background:#8E4FA0}.patch i:nth-child(8n+6){background:#D7262E}
.patch i:nth-child(8n+7){background:#F5B82E}.patch i:nth-child(8n+8){background:#C9A3D6}
.brand .wrap { padding-block: 16px 22px; display: grid; gap: 14px; }
.brand-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.made { display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 11px; letter-spacing: .03em; opacity: .85; }
.made img { width: 18px; height: 18px; border-radius: 5px; }
.atelier { display: flex; align-items: center; gap: 14px; }
.atelier .logo { flex: none; width: 64px; height: 64px; border-radius: 18px; object-fit: cover; background: var(--on-brand); box-shadow: 0 0 0 3px color-mix(in srgb, var(--on-brand) 35%, transparent); }
.atelier .txt { min-width: 0; }
.langs { display: flex; gap: 6px; }
.lang { min-height: 34px; padding: 0 11px; border-radius: 999px; cursor: pointer; font-weight: 800; font-size: 12px;
  border: 1.5px solid color-mix(in srgb, var(--on-brand) 45%, transparent); background: transparent; color: var(--on-brand); }
.lang[aria-pressed="true"] { background: var(--on-brand); color: var(--brand); border-color: var(--on-brand); }
.atelier h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(28px, 7vw, 36px); line-height: 1.08; margin: 0; text-wrap: balance; }
.atelier p { margin: 6px 0 0; opacity: .92; font-weight: 600; }
.demo { display: inline-block; margin-top: 8px; padding: 3px 10px; border-radius: 999px; background: color-mix(in srgb, var(--on-brand) 18%, transparent); font-size: 12px; font-weight: 800; }

/* Passos */
section.step { margin-top: 22px; }
.step-h { display: flex; align-items: baseline; gap: 10px; margin: 0 0 10px; }
.num { flex: none; width: 28px; height: 28px; border-radius: 50%; background: var(--brand); color: var(--on-brand);
  display: grid; place-items: center; font-weight: 800; font-size: 14px; transform: translateY(4px); }
.step-h h2 { font-family: var(--font-display); font-size: 22px; margin: 0; font-weight: 700; }
.hint { color: var(--muted); margin: -4px 0 12px 38px; font-size: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.group-t { font-size: 12px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 14px 4px 6px; }
.svc { display: flex; align-items: center; gap: 12px; padding: 14px; border-bottom: 1px solid var(--line); cursor: pointer; min-height: 56px; }
.svc:last-child { border-bottom: 0; }
.svc input { position: absolute; opacity: 0; pointer-events: none; }
.box { flex: none; width: 24px; height: 24px; border-radius: 7px; border: 2px solid var(--line); display: grid; place-items: center; transition: background .15s; }
.svc input:checked + .box { background: var(--brand); border-color: var(--brand); }
.svc input:checked + .box::after { content: ""; width: 12px; height: 7px; border: 3px solid var(--on-brand); border-top: 0; border-right: 0; transform: rotate(-45deg) translate(1px, -1px); }
.svc input:focus-visible + .box { outline: 3px solid var(--brand); outline-offset: 2px; }
.svc .name { flex: 1; font-weight: 700; }
.svc .price { font-weight: 800; white-space: nowrap; }
.svc .price.quote { color: var(--accent); font-weight: 700; font-size: 14px; }

.custom { padding: 14px; display: grid; gap: 10px; }
.row { display: flex; gap: 8px; }
.field { width: 100%; min-height: 48px; padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); }
.field:focus { border-color: var(--brand); outline: none; }
textarea.field { min-height: 84px; resize: vertical; }
label.lbl { display: block; font-weight: 700; font-size: 14px; margin: 12px 0 6px; }
.btn { min-height: 48px; padding: 0 18px; border-radius: 12px; border: 0; cursor: pointer; font-weight: 800; }
.btn-soft { background: var(--brand-tint); color: var(--brand-deep); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 8px 8px 8px 12px; border-radius: 999px; background: var(--brand-tint); color: var(--brand-deep); font-weight: 700; font-size: 14px; }
.chip button { border: 0; background: transparent; cursor: pointer; width: 26px; height: 26px; border-radius: 50%; font-size: 16px; line-height: 1; color: inherit; }

.kinds { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.kind { min-height: 52px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 700; padding: 8px; }
.kind[aria-pressed="true"] { border-color: var(--brand); background: var(--brand-tint); color: var(--brand-deep); }
.days { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 8px; scroll-snap-type: x mandatory; }
.day { flex: none; width: 64px; padding: 8px 0; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); cursor: pointer; text-align: center; scroll-snap-align: start; }
.day b { display: block; font-size: 20px; }
.day small { display: block; font-size: 12px; color: var(--muted); text-transform: capitalize; }
.day[aria-pressed="true"] { border-color: var(--brand); background: var(--brand); color: var(--on-brand); }
.day[aria-pressed="true"] small { color: var(--on-brand); }
.slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 8px; margin-top: 8px; }
.slot { min-height: 44px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 700; }
.slot[aria-pressed="true"] { border-color: var(--brand); background: var(--brand); color: var(--on-brand); }
.slot:disabled { opacity: .35; text-decoration: line-through; cursor: not-allowed; }
.empty { color: var(--muted); padding: 10px 2px; }

/* Barra fixa */
.bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px); z-index: 5; }
.bar .wrap { display: flex; align-items: center; gap: 12px; padding-block: 12px; }
.total { flex: 1; min-width: 0; }
.total small { display: block; color: var(--muted); font-size: 12px; font-weight: 700; }
.total b { font-size: 20px; }
.total em { display: block; font-style: normal; color: var(--accent); font-size: 12px; font-weight: 700; }
.send { background: var(--brand); color: var(--on-brand); min-width: 150px; }
.send:disabled { opacity: .45; cursor: not-allowed; }
.msg { margin-top: 14px; padding: 12px 14px; border-radius: 12px; background: var(--err-bg); color: var(--err); font-weight: 700; }

/* Concluído */
.done { text-align: center; padding: 40px 8px; }
.done .ok { width: 72px; height: 72px; margin: 0 auto 16px; border-radius: 50%; background: var(--brand-tint); display: grid; place-items: center; }
.done h2 { font-family: var(--font-display); font-size: 28px; margin: 0 0 8px; }
.done p { color: var(--muted); margin: 0 auto 20px; max-width: 420px; }
.wa { display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; background: #1f9d55; color: #fff; }
/* Orçamento para aprovar */
.q-hello { font-size: 17px; margin: 20px 0 4px; }
.q-row { display: flex; gap: 12px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.q-row:last-child { border-bottom: 0; }
.q-row .n { flex: 1; min-width: 0; }
.q-row .n b { display: block; }
.q-row .n small { color: var(--muted); }
.q-row .v { font-weight: 800; white-space: nowrap; text-align: right; }
.q-row .v.quote { color: var(--accent); font-weight: 700; font-size: 14px; }
.q-sum { padding: 6px 14px; }
.q-sum div { display: flex; justify-content: space-between; padding: 6px 0; }
.q-sum .big { font-size: 20px; font-weight: 800; border-top: 1px solid var(--line); padding-top: 10px; margin-top: 4px; }
.q-info { display: grid; gap: 6px; padding: 14px; }
.state { margin-top: 16px; padding: 14px; border-radius: 12px; font-weight: 700; }
.state.ok { background: var(--brand-tint); color: var(--brand-deep); }
.state.warn { background: #fff4e0; color: #8a4b00; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .state.warn { background: #3a2a14; color: #f2c37f; } }
.actions { display: grid; gap: 10px; margin-top: 18px; }
.btn-main { background: var(--brand); color: var(--on-brand); width: 100%; }
.btn-line { background: transparent; border: 1.5px solid var(--brand); color: var(--brand); width: 100%; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
footer { text-align: center; color: var(--muted); font-size: 12px; margin: 36px 0 12px; }
footer a { color: inherit; }
.loading { padding: 60px 0; text-align: center; color: var(--muted); }
</style>

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = (v) => new Intl.NumberFormat(LOCALES[st.lang], { style: 'currency', currency: st.at?.currency || 'BRL' }).format(v || 0);

async function rpc(fn, body) {
  const res = await fetch(COSER_URL + '/rest/v1/rpc/' + fn, {
    method: 'POST',
    headers: { apikey: COSER_KEY, Authorization: 'Bearer ' + COSER_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  const txt = await res.text();
  const data = txt ? JSON.parse(txt) : null;
  if (!res.ok) throw new Error((data && (data.message || data.hint)) || res.statusText);
  return data;
}

let brandKey = null;
const darkMq = window.matchMedia('(prefers-color-scheme: dark)');
function applyBrand(key) {
  if (key) brandKey = key;
  const b = BRAND[brandKey];
  if (!b) return;
  const dark = darkMq.matches;
  const [c, deep, tint] = dark ? b.dark : b.light;
  const r = document.documentElement.style;
  r.setProperty('--brand', c); r.setProperty('--brand-deep', deep); r.setProperty('--brand-tint', tint);
  r.setProperty('--on-brand', dark ? '#111111' : '#ffffff');
  const meta = document.querySelector('meta[name="theme-color"]'); if (meta) meta.content = c;
}
darkMq.addEventListener?.('change', () => applyBrand());

function openDays() {
  const out = [], closed = st.at.closed_days || [0];
  const d = new Date(); d.setHours(0, 0, 0, 0);
  for (let i = 0; out.length < 14 && i < 40; i++) {
    const x = new Date(d); x.setDate(d.getDate() + i);
    if (!closed.includes(x.getDay())) out.push(x);
  }
  return out;
}

function renderDays() {
  const days = openDays();
  if (!st.day || !days.some((x) => +x === +st.day)) st.day = days[0];
  const wd = new Intl.DateTimeFormat(LOCALES[st.lang], { weekday: 'short' });
  const mo = new Intl.DateTimeFormat(LOCALES[st.lang], { month: 'short' });
  $('days').innerHTML = days.map((x) => `
    <button type="button" class="day" data-d="${+x}" aria-pressed="${+x === +st.day}">
      <small>${esc(wd.format(x))}</small><b>${x.getDate()}</b><small>${esc(mo.format(x))}</small>
    </button>`).join('');
}

function freeSlots() {
  const a = st.at, step = a.slot_minutes || 30, now = Date.now();
  const busy = (a.busy || []).map((b) => [new Date(b.starts_at).getTime(), new Date(b.starts_at).getTime() + (b.minutes || step) * 60000]);
  const out = [];
  for (let m = a.open_hour * 60; m + step <= a.close_hour * 60; m += step) {
    const s = new Date(st.day); s.setHours(0, m, 0, 0);
    const t0 = s.getTime(), t1 = t0 + step * 60000;
    out.push({ at: s, free: t0 > now + 3600000 && !busy.some(([b0, b1]) => t0 < b1 && t1 > b0) });
  }
  return out;
}

function renderSlots() {
  const slots = freeSlots();
  const fmt = new Intl.DateTimeFormat(LOCALES[st.lang], { hour: '2-digit', minute: '2-digit' });
  if (st.slot && !slots.some((s) => s.free && +s.at === +st.slot)) st.slot = null;
  $('slots').innerHTML = slots.some((s) => s.free)
    ? slots.map((s) => `<button type="button" class="slot" data-s="${+s.at}" ${s.free ? '' : 'disabled'} aria-pressed="${+s.at === +st.slot}">${fmt.format(s.at)}</button>`).join('')
    : `<div class="empty">${esc(t('noSlots'))}</div>`;
}

function valid() {

  if (st.kind !== 'none' && !st.slot) return 'needSlot';
  return null;
}

// ---------- Tabela sempre atualizada ----------
// Busca de novo os serviços e horários do ateliê. Mantém o que a cliente marcou
// (menos serviços removidos). Retorna true se algo que ela marcou mudou.
async function refreshAtelier() {
  if (isDemo || !slug || !st.at) return false;
  const fresh = await rpc('public_atelier', { p_slug: slug });
  if (!fresh) return false;
  const before = new Map(st.at.services.map((x) => [x.id, Number(x.price)]));
  const now = new Map(fresh.services.map((x) => [x.id, Number(x.price)]));
  let changed = false;
  for (const id of [...st.sel]) {
    if (!now.has(id)) { st.sel.delete(id); changed = true; }
    else if (now.get(id) !== before.get(id)) changed = true;
  }
  const sameList = before.size === now.size && [...now].every(([k, v]) => before.get(k) === v)
    && JSON.stringify(st.at.services.map((x) => x.name + x.category + (x.name_en || '') + (x.name_es || '')))
       === JSON.stringify(fresh.services.map((x) => x.name + x.category + (x.name_en || '') + (x.name_es || '')));
  st.at = fresh;
  if (!sameList || JSON.stringify(st.at.busy) !== JSON.stringify(fresh.busy)) {
    renderServices(); renderBar();
    if (st.kind !== 'none') { renderDays(); renderSlots(); }
  }
  return changed;
}
let lastRefresh = Date.now();
async function softRefresh() {
  if (Date.now() - lastRefresh < 15000 || st.sending || $('form').hidden) return;
  lastRefresh = Date.now();
  try { await refreshAtelier(); } catch (_) {}
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) softRefresh(); });
window.addEventListener('focus', softRefresh);
setInterval(softRefresh, 60000);

async function submit() {
  $('err').hidden = true;
  const v = valid();
  if (v) return showErr(v);
  if (isDemo) return renderDone(123);
  st.sending = true; renderBar();
  try {
    // Confere a tabela na hora de enviar: se o ateliê mudou algo marcado, mostra antes de enviar
    if (await refreshAtelier()) {
      st.sending = false; renderBar();
      $('services').scrollIntoView({ behavior: 'smooth' });
      return showErr('changed');
    }
    const r = await rpc('request_order', {
      p_slug: slug,
      p_name: $('fName').value.trim(),
      p_phone: $('fPhone').value.trim(),
      p_email: $('fEmail').value.trim(),
      p_service_ids: [...st.sel],
      p_custom: st.custom,
      p_notes: $('fNotes').value.trim(),
      p_appt_kind: st.kind === 'none' ? null : st.kind,
      p_starts_at: st.kind === 'none' ? null : new Date(st.slot).toISOString(),
    });
    renderDone(r.number);
  } catch (e) {
    const m = String(e.message || '');
    showErr(m.includes('too_many_requests') ? 'tooMany' : m.includes('phone') ? 'needPhone'
      : m.includes('past_date') ? 'needSlot' : 'sendErr');
  } finally {
    st.sending = false; renderBar();
  }
}

             <div><b>${esc(t('q_balance'))}</b><b>${money(Math.max(0, balance))}</b></div>` : ''}
        </div>
      </div>
      <div class="card q-info" style="margin-top:12px">
        <div><b>${esc(t('q_status'))}:</b> ${esc(t('st_' + q.status))}</div>
        ${q.due_date ? `<div><b>${esc(t('q_due'))}:</b> ${esc(d(q.due_date + 'T12:00:00'))}</div>` : ''}
        ${q.appointments.map((p) => `<div><b>${esc(t('q_appt'))}:</b> ${esc(kindName(p.kind))} · ${esc(dt(p.starts_at))}${p.status === 'requested' ? ` (${esc(t('q_pending_appt'))})` : ''}</div>`).join('')}
        ${q.description ? `<div><b>${esc(t('q_notes'))}:</b> ${esc(q.description)}</div>` : ''}
      </div>
      ${hasQuote && canAct ? `<div class="state warn">* ${esc(t('q_hasQuote'))}</div>` : ''}
      ${state}
      ${canAct && qs.mode === 'view' ? `
        <div class="actions">
          <button class="btn btn-main" type="button" id="qApprove">${esc(t('q_approve'))}</button>
          <button class="btn btn-line" type="button" id="qChanges">${esc(t('q_changes'))}</button>
        </div>` : ''}
      ${canAct && qs.mode === 'changes' ? `
        <label class="lbl" for="qNote">${esc(t('q_changes'))}</label>
        <textarea class="field" id="qNote" maxlength="1000" placeholder="${esc(t('q_changesPh'))}"></textarea>
        <div class="msg" id="qErr" hidden></div>
        <div class="actions">
          <button class="btn btn-main" type="button" id="qSendChanges">${esc(t('q_sendChanges'))}</button>
          <button class="btn btn-line" type="button" id="qBack">${esc(t('q_cancel'))}</button>
        </div>` : ''}
    </section>
    <footer><a href="https://reluhsc.com" target="_blank" rel="noopener">${esc(t('made'))}</a></footer>`;
  if (typed && $('qNote')) $('qNote').value = typed;
  $('quote').hidden = false;
}

async function respondQuote(action) {
  if (qs.busy) return;
  let note = null;
  if (action === 'changes') {
    note = ($('qNote').value || '').trim();
    if (note.length < 3) { $('qErr').textContent = t('q_needNote'); $('qErr').hidden = false; return; }
  }
  qs.busy = true;
  document.querySelectorAll('#quote button').forEach((b) => (b.disabled = true));
  try {
    if (!isDemoQuote) await rpc('respond_quote', { p_token: token, p_action: action, p_note: note });
    const n = qs.q.number, phone = (qs.q.atelier.phone || '').replace(/\D/g, '');
    $('quote').hidden = true;
    $('done').innerHTML = `
      <div class="ok"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="var(--brand)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></div>
      <h2>${esc(t(action === 'approve' ? 'q_okA' : 'q_okC'))}</h2>
      <p>${esc(t(action === 'approve' ? 'q_okAP' : 'q_okCP', { n }))}</p>
      ${phone ? `<a class="btn wa" href="https://wa.me/${phone}?text=${encodeURIComponent(t(action === 'approve' ? 'q_waA' : 'q_waC', { n }))}" target="_blank" rel="noopener">${esc(t('doneWa'))}</a>` : ''}`;
    $('done').hidden = false;
    window.scrollTo({ top: 0, behavior: 'smooth' });
  } catch (e) {
    qs.busy = false;
    document.querySelectorAll('#quote button').forEach((b) => (b.disabled = false));
    alertMsg(t('sendErr'));
  }
}
function alertMsg(m) { const el = $('qErr'); if (el) { el.textContent = m; el.hidden = false; } else { $('fatal').textContent = m; $('fatal').hidden = false; } }

$('quote').addEventListener('click', (e) => {
  const id = e.target.id;
  if (id === 'qApprove') respondQuote('approve');
  else if (id === 'qChanges') { qs.mode = 'changes'; renderQuote(); $('qNote').focus(); }
  else if (id === 'qBack') { qs.mode = 'view'; renderQuote(); }
  else if (id === 'qSendChanges') respondQuote('changes');
});

const isDemoQuote = token === 'demo';
function demoQuote() {
  return { number: 57, status: 'quote', description: '', approval: 'pending', approval_note: null, approval_at: null,
    due_date: new Date(Date.now() + 9 * 864e5).toISOString().slice(0, 10), discount: 10, total: 155, deposit: 70, paid: 0,
    customer: 'Ana', atelier: { name: 'Ateliê da Maria', phone: '', address: '', currency: 'BRL', locale: 'pt' },
    items: [
      { name: 'Barra de calça', name_en: 'Pants hem', name_es: 'Bastilla de pantalón', garment: 'Calça jeans', qty: 2, unit_price: 30 },
      { name: 'Troca de zíper', name_en: 'Zipper replacement', name_es: 'Cambio de cremallera', garment: 'Jaqueta', qty: 1, unit_price: 40, description: 'Zíper metálico 50 cm' },
      { name: null, garment: 'Ajuste extra na cintura', qty: 1, unit_price: 65 },
    ],
    appointments: [{ kind: 'fitting', starts_at: new Date(Date.now() + 3 * 864e5).toISOString(), status: 'scheduled' }] };
}

async function loadQuote() {
  try {
    const q = isDemoQuote ? demoQuote() : await rpc('public_quote', { p_token: token });
    $('loading').hidden = true;
    if (!q) { $('atName').textContent = 'Coser'; $('fatal').textContent = t('q_notFound'); $('fatal').hidden = false; return; }
    qs.q = q;
    let saved = null; try { saved = localStorage.getItem('coser_lang'); } catch (_) {}
    if (!params.get('lang') && !saved && T[q.atelier.locale]) st.lang = q.atelier.locale;
    renderLangs(); renderStatic(); renderQuote();
  } catch (e) {
    $('loading').hidden = true; $('atName').textContent = 'Coser';
    $('fatal').textContent = t('loadErr'); $('fatal').hidden = false;
  }
}

async function load() {
  if (token) {
    let saved = null; try { saved = localStorage.getItem('coser_lang'); } catch (_) {}
    const nav = (navigator.language || 'pt').slice(0, 2);
    st.lang = T[params.get('lang')] ? params.get('lang') : T[saved] ? saved : T[nav] ? nav : 'pt';
    renderLangs(); renderStatic();
    return loadQuote();
  }
  let saved = null; try { saved = localStorage.getItem('coser_lang'); } catch (_) {}
  const nav = (navigator.language || 'pt').slice(0, 2);
  st.lang = T[params.get('lang')] ? params.get('lang') : T[saved] ? saved : T[nav] ? nav : 'pt';
  renderLangs(); renderStatic();
  try {
    const at = isDemo ? demoAtelier() : (slug ? await rpc('public_atelier', { p_slug: slug }) : null);
    if (!at) { $('atName').textContent = 'Coser'; $('loading').hidden = true; $('fatal').textContent = t('notFound'); $('fatal').hidden = false; return; }
    st.at = at;
    if (!params.get('lang') && !saved && T[at.locale]) st.lang = at.locale;
    $('loading').hidden = true; $('form').hidden = false; $('bar').hidden = false;
    renderAll();
  } catch (e) {
    $('loading').hidden = true; $('atName').textContent = 'Coser';
    $('fatal').textContent = t('loadErr'); $('fatal').hidden = false;
  }
}
load();
</script>
</body>
